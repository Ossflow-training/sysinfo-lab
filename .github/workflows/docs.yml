name: docs
on:
  push:
    branches: [main]
    # l'environnement github-pages n'accepte que main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # un seul déploiement Pages à la fois
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Installation de MkDocs
        run: pip install mkdocs
        # + thème et plugins déclarés dans mkdocs.yml
      - name: Construction du site
        run: mkdocs build
        # site généré dans site/
      - uses: actions/configure-pages@v6
      - name: Publication du site comme artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # déployer sur GitHub Pages
      id-token: write # prouver l'origine du déploiement
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v5